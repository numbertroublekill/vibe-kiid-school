<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习方法急诊室 · 大屏投票版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071310;
  --ink-2:#0c1d19;
  --grid:rgba(61,220,151,.09);
  --mint:#3ddc97;
  --mint-dim:#1f7a57;
  --amber:#ffb454;
  --red:#ff5c5c;
  --paper:#e8f5ef;
  --muted:#6f9b8c;

  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  overflow:hidden;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:clamp(28px,3.2vw,52px) clamp(28px,3.2vw,52px);
}
#app{height:100%;display:flex;flex-direction:column;max-width:1680px;margin:0 auto;padding:0 clamp(16px,2.4vw,44px)}

/* ── 监护仪顶栏 ───────────────────────── */
.monitor{flex:0 0 auto;padding-top:clamp(10px,1.4vh,20px)}
#ecg{display:block;width:100%;height:clamp(46px,7vh,86px)}
.readout{
  display:flex;align-items:baseline;gap:clamp(14px,2vw,34px);
  font-family:var(--mono);font-size:clamp(11px,1.05vw,15px);
  letter-spacing:.14em;color:var(--mint-dim);
  border-bottom:1px solid rgba(61,220,151,.22);
  padding-bottom:10px;text-transform:uppercase;
}
.readout b{color:var(--mint);font-weight:700}
.readout .spacer{flex:1}
.readout .clock{font-size:clamp(15px,1.7vw,24px);color:var(--paper);letter-spacing:.06em}
.readout .clock.low{color:var(--amber)}
.readout .clock.zero{color:var(--red);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}

/* ── 舞台 ─────────────────────────────── */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2vh,26px);padding:clamp(12px,2.2vh,30px) 0}

.eyebrow{font-family:var(--mono);font-size:clamp(11px,1.05vw,15px);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}

/* 患者主诉 */
.chart{border-left:3px solid var(--mint);padding-left:clamp(14px,1.6vw,26px)}
.chart .who{font-family:var(--mono);font-size:clamp(12px,1.15vw,17px);color:var(--mint);letter-spacing:.14em;margin-bottom:.5em}
.chart .say{
  font-family:var(--serif);font-weight:600;line-height:1.5;
  font-size:clamp(21px,2.5vw,42px);color:#fff;text-wrap:balance;
}
.chart .say::before{content:"「";color:var(--mint-dim)}
.chart .say::after{content:"」";color:var(--mint-dim)}
.chart.compact .say{font-size:clamp(15px,1.45vw,22px);font-weight:400;color:var(--paper);opacity:.75}

/* 选项 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(9px,1.2vh,18px)}
.opt{
  position:relative;overflow:hidden;text-align:left;cursor:pointer;
  background:var(--ink-2);color:var(--paper);
  border:1px solid rgba(61,220,151,.26);border-radius:2px;
  padding:clamp(12px,1.7vh,22px) clamp(14px,1.6vw,26px);
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  column-gap:clamp(12px,1.4vw,22px);
  transition:border-color .15s,transform .08s;font-family:var(--sans);
}
.opt:hover{border-color:var(--mint)}
.opt:active{transform:translateY(1px)}
.opt:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.opt .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(61,220,151,.14);border-right:2px solid rgba(61,220,151,.5);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.opt>*{position:relative}
.opt .key{font-family:var(--mono);font-size:clamp(13px,1.3vw,20px);color:var(--ink);background:var(--mint-dim);width:2em;height:2em;display:grid;place-items:center;border-radius:2px;font-weight:700}
.opt .name{font-size:clamp(17px,1.85vw,29px);font-weight:700;line-height:1.25}
.opt .sub{display:block;font-size:clamp(12px,1.05vw,16px);color:var(--muted);font-weight:400;margin-top:.35em}
.opt .cnt{font-family:var(--mono);font-size:clamp(22px,2.6vw,42px);font-weight:700;color:var(--mint);min-width:1.6em;text-align:right}
.opt.correct{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 34px rgba(61,220,151,.22)}
.opt.correct .key{background:var(--mint)}
.opt.faded{opacity:.34}
.opt.locked{cursor:default}
.opt .tag{position:absolute;top:0;right:0;font-family:var(--mono);font-size:clamp(10px,.9vw,13px);letter-spacing:.16em;background:var(--mint);color:var(--ink);padding:.35em .7em;font-weight:700}

/* 揭晓后的紧凑票数条 */
.opts.mini{grid-template-columns:repeat(4,1fr);gap:8px}
.opts.mini .opt{padding:8px 12px;grid-template-columns:auto 1fr auto;column-gap:10px}
.opts.mini .name{font-size:clamp(12px,1.05vw,16px);font-weight:400}
.opts.mini .sub,.opts.mini .tag{display:none}
.opts.mini .cnt{font-size:clamp(15px,1.4vw,22px)}
.opts.mini .key{font-size:11px;width:1.8em;height:1.8em}

/* 处方笺 */
.rx{border:1px solid rgba(61,220,151,.3);border-top:3px solid var(--mint);background:var(--ink-2);padding:clamp(14px,2vh,26px) clamp(16px,2vw,32px);flex:1 1 auto;min-height:0;overflow:auto}
.rx-head{display:flex;align-items:baseline;gap:clamp(10px,1.4vw,20px);flex-wrap:wrap;margin-bottom:clamp(10px,1.4vh,18px)}
.rx-head h2{font-size:clamp(22px,2.5vw,40px);font-weight:900;letter-spacing:.02em}
.rx-head .for{font-family:var(--mono);font-size:clamp(11px,1vw,15px);color:var(--amber);letter-spacing:.14em;border:1px solid var(--amber);padding:.3em .7em}
.rx-cols{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(16px,2vw,36px)}
.rx h3{font-family:var(--mono);font-size:clamp(11px,1vw,14px);letter-spacing:.2em;color:var(--muted);margin-bottom:.7em;text-transform:uppercase}
.rx p{font-size:clamp(14px,1.25vw,19px);line-height:1.75;color:var(--paper)}
.rx ol{list-style:none;counter-reset:s}
.rx ol li{counter-increment:s;font-size:clamp(14px,1.25vw,19px);line-height:1.65;margin-bottom:.6em;padding-left:2.1em;position:relative}
.rx ol li::before{content:counter(s);position:absolute;left:0;top:.15em;font-family:var(--mono);font-size:.8em;color:var(--ink);background:var(--mint);width:1.7em;height:1.7em;display:grid;place-items:center;font-weight:700}
.rx .oneline{margin-top:clamp(12px,1.6vh,22px);padding-top:clamp(10px,1.4vh,18px);border-top:1px dashed rgba(61,220,151,.3);font-family:var(--serif);font-weight:600;font-size:clamp(17px,1.75vw,27px);color:var(--mint)}
.rx .note{margin-top:.9em;font-size:clamp(13px,1.15vw,17px);line-height:1.7;color:var(--muted)}
.rx .note b{color:var(--amber);font-weight:400}

/* 封面 / 结算 */
.cover{text-align:left;max-width:56ch}
.cover .kicker{font-family:var(--mono);letter-spacing:.3em;color:var(--mint);font-size:clamp(12px,1.15vw,17px);margin-bottom:1.2em}
.cover h1{font-size:clamp(38px,6.2vw,104px);font-weight:900;line-height:.98;letter-spacing:-.02em;margin-bottom:.28em}
.cover h1 em{font-style:normal;color:var(--mint)}
.cover p{font-family:var(--serif);font-size:clamp(16px,1.6vw,26px);line-height:1.75;color:var(--paper);opacity:.85}
.cover ul{margin-top:1.4em;display:flex;gap:clamp(14px,2.2vw,40px);flex-wrap:wrap;list-style:none;font-family:var(--mono);font-size:clamp(11px,1.05vw,15px);color:var(--muted);letter-spacing:.1em}
.cover ul b{color:var(--paper);display:block;font-size:clamp(19px,2.2vw,34px);font-weight:700;letter-spacing:0;margin-bottom:.2em}

.score-row{display:flex;align-items:flex-end;gap:clamp(18px,3vw,60px);flex-wrap:wrap}
.score-big{font-family:var(--mono);font-size:clamp(64px,11vw,180px);font-weight:700;line-height:.85;color:var(--mint)}
.score-big small{font-size:.3em;color:var(--muted)}
.rank{font-size:clamp(24px,3vw,52px);font-weight:900}
.rank span{display:block;font-family:var(--mono);font-size:clamp(11px,1vw,14px);letter-spacing:.2em;color:var(--muted);font-weight:400;margin-bottom:.5em}

/* 七味处方总表 */
.grid7{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1vw,14px)}
.card7{border:1px solid rgba(61,220,151,.24);background:var(--ink-2);padding:clamp(10px,1.3vh,18px) clamp(11px,1.1vw,18px);border-left:3px solid var(--mint)}
.card7 .sym{font-family:var(--mono);font-size:clamp(10px,.95vw,13px);color:var(--amber);letter-spacing:.1em;margin-bottom:.5em}
.card7 .nm{font-size:clamp(15px,1.5vw,23px);font-weight:700;margin-bottom:.35em}
.card7 .ol{font-size:clamp(12px,1.05vw,16px);color:var(--muted);line-height:1.55}
.card7.wide{grid-column:span 1}

/* ── 控制条 ───────────────────────────── */
footer{flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:clamp(10px,1.6vh,20px) 0;border-top:1px solid rgba(61,220,151,.22)}
button.ctl{
  font-family:var(--mono);letter-spacing:.14em;cursor:pointer;border-radius:2px;
  background:transparent;color:var(--muted);border:1px solid rgba(61,220,151,.3);
  padding:.75em 1.1em;font-size:clamp(11px,1vw,14px);transition:.15s;
}
button.ctl:hover{color:var(--paper);border-color:var(--mint)}
button.ctl:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.ctl.primary{background:var(--mint);color:var(--ink);border-color:var(--mint);font-weight:700;padding:.85em 1.8em;font-size:clamp(12px,1.15vw,17px)}
button.ctl.primary:hover{background:#5ff0b1}
.hint{margin-left:auto;font-family:var(--mono);font-size:clamp(10px,.9vw,13px);color:rgba(111,155,140,.7);letter-spacing:.1em}
.hint kbd{border:1px solid rgba(111,155,140,.4);padding:.15em .45em;border-radius:2px;margin:0 .15em}

/* 方法总表浮层 */
#sheet{position:fixed;inset:0;background:rgba(3,9,8,.97);z-index:50;display:none;padding:clamp(20px,4vh,60px) clamp(20px,4vw,80px);overflow:auto}
#sheet.on{display:block}
#sheet h2{font-size:clamp(24px,3vw,46px);font-weight:900;margin-bottom:.2em}
#sheet .eyebrow{margin-bottom:1.4em}

@media (max-width:820px){
  .opts,.rx-cols,.grid7{grid-template-columns:1fr}
  .opts.mini{grid-template-columns:1fr 1fr}
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="app">
  <div class="monitor">
    <canvas id="ecg"></canvas>
    <div class="readout">
      <span>病例 <b id="rdCase">--</b></span>
      <span>诊断准确率 <b id="rdAcc">--</b></span>
      <span>本题总票数 <b id="rdVotes">0</b></span>
      <span class="spacer"></span>
      <span class="clock" id="clock">--:--</span>
    </div>
  </div>

  <main id="stage"></main>

  <footer id="ctrls"></footer>
</div>

<div id="sheet" role="dialog" aria-label="七味处方总表">
  <div class="eyebrow">按 M 关闭</div>
  <h2>七味处方 · 总表</h2>
  <div class="eyebrow">左边是症状，右边是药。记住症状，比记住药名更重要。</div>
  <div class="grid7" id="sheetGrid"></div>
</div>

<script>
/* ═══════════════ 数据 ═══════════════ */
const M = {
  comfort:{
    name:"舒适圈理论", sym:"不想动", one:"不是你不想动，是任务太大了。",
    why:"我们面对的任务大致分三圈：舒适圈（太简单，无聊到不想碰）、学习圈（有点难，跳一跳够得着）、恐慌圈（太难，看一眼就想逃）。“不想动”很多时候不是懒，是任务被定得太大，一开口就掉进了恐慌圈——而大脑对“我做不到”的第一反应永远是回避。",
    how:["把任务说清楚：我这一步到底要做的是哪一件事。","问自己：这件事我有几成把握？低于五成，说明它现在在恐慌圈里。","把它切小，切到你有八成把握的那一步，从那一步开始。"]
  },
  freewrite:{
    name:"自由书写法", sym:"想动，但心烦意乱", one:"先把脑子倒空，再往里装东西。",
    why:"人的工作记忆很小，情绪和心事会实实在在地占掉它的带宽。被担心的事占满时，没有位置留给要学的内容——所以你会“看了二十分钟一个字没进去”。把脑子里的东西写到纸上，等于把内存腾出来。",
    how:["计时八分钟，纸笔或电脑都行。","笔不停手，想到什么写什么：不修改、不排版、不评判、不管有没有逻辑。","时间到就停。写完可以直接扔掉，它不需要给任何人看。"]
  },
  nohate:{
    name:"不讨厌清单", sym:"想动，但不知道做什么", one:"找不到“最想做”，就从“不讨厌”开始。",
    why:"“你喜欢什么”是个太大的问题，很多成年人一辈子都答不上来，逼问自己只会更卡住。但“你不讨厌什么”门槛低得多，几乎人人答得出。兴趣通常不是先被找到、再去做的，而是在做的过程中慢慢长出来的。",
    how:["拿一张纸，写下二十件“不讨厌”的事，允许琐碎、允许没用。","在“今天就能动手”的那几件上画圈。","随便挑一件，做二十分钟。感觉如何，做完才知道。"]
  },
  todo:{
    name:"To Do List", sym:"记不住自己要做的事", one:"大脑是用来思考的，不是用来存储的。",
    why:"没做完的事会在脑子里反复弹窗提醒你（心理学上叫蔡格尼克效应）。这既让你分心，又并不保证你真的记得住——最糟的组合。写下来之后，大脑确认“这件事有人管了”，提醒才会松开。清单真正的价值不是管理时间，是替大脑存档。",
    how:["只用一个收件箱：一个本子，或一个 app，所有事都往里倒，不分类。","每条用动词开头，写到“下一步具体做什么”，而不是写一个话题。","每天固定一个时间（比如晚饭后）清空、检查一遍。"]
  },
  matrix:{
    name:"重要紧急 × 消费投资创造", sym:"不知道自己要先做什么", one:"紧急的事会自己喊你，重要的事只能你自己排。",
    why:"第一层用重要／紧急分四格。多数人的一天都消耗在“紧急但不重要”里，看起来很忙，年底回头什么也没留下。第二层再问一句：这件事是消费（做完就没了）、投资（以后会长出别的东西）、还是创造（产出别人看得见的东西）？决定你走多远的，是被保护下来的投资与创造时间。",
    how:["把清单上的事扔进四个格子：重要紧急／重要不紧急／紧急不重要／都不是。","给每件事再贴第二个标签：消费、投资、还是创造。","今天先锁定一段“重要不紧急 × 投资或创造”的时间，其余的往后排。"]
  },
  fivemin:{
    name:"五分钟启动法", sym:"不知道自己什么时候开始", one:"状态不是等来的，是做出来的。",
    why:"开始一件事的心理成本，远高于继续做这件事的成本。真正动手之后几分钟，抗拒感就会明显下降——你熟悉这个感觉：最难受的永远是坐下之前那半小时。所以问题不是“我什么时候才有状态”，而是“我怎么把‘开始’这一下变便宜”。",
    how:["和自己签一个很小的合同：只做五分钟。","定好闹钟。五分钟一到，允许你光明正大地停下。","大多数时候你会不想停；真想停也没关系，明天再来五分钟。"]
  },
  pomodoro:{
    name:"番茄工作法", sym:"做着做着就走神了", one:"走神不可耻，重要的是回来的速度。",
    why:"注意力不是靠意志力硬撑的，它天然有起落。番茄工作法用一个外部节奏（二十五分钟专注 + 五分钟休息）替你管住节奏；更关键的是，它给“走神”提供了一个正式的处理办法——不是责怪自己，而是记一笔，然后回来。",
    how:["选定这一个番茄钟里只做的那一件事，写在纸最上面。","计时二十五分钟。中途想起别的事，就在纸边记一行，立刻回到原来的事。","响铃就休息五分钟，站起来离开桌子。每四个番茄，休息久一点。"]
  }
};
const ORDER = ["comfort","freewrite","nohate","todo","matrix","fivemin","pomodoro"];

const CASES = [
  { who:"病例 01 · 高一 · 小林",
    say:"老师布置了一篇三千字的研究报告。我看了一眼题目就把本子合上了。我盯着“三千字”这三个字发怵，感觉自己根本写不出来。",
    opts:["comfort","fivemin","todo","matrix"], ans:"comfort",
    note:"他不是忘了要写，也不是不知道该先写哪一篇。他是被任务的<b>体量</b>吓退了——这是掉进恐慌圈的标准反应。先把“写三千字”换成“列出三个我想搞清楚的问题”，任务回到学习圈，人就动得起来。" },

  { who:"病例 02 · 初三 · 阿May",
    say:"明天数学考试。可是昨天我和最好的朋友吵了一架，书摊在面前二十分钟了，一个字都没进脑子，翻来覆去全是那句话。",
    opts:["freewrite","pomodoro","comfort","todo"], ans:"freewrite",
    note:"挡住她的不是任务太难，是情绪占满了工作记忆。番茄钟能管住节奏，管不住占着内存的心事。<b>先花八分钟倒空，再开番茄钟</b>，顺序反了就没用。" },

  { who:"病例 03 · 初二 · 大熊",
    say:"放假第一天，我在房间坐了一上午，什么也没干。爸妈问我想干什么，我说不知道。他们问我喜欢什么，我更答不上来。",
    opts:["nohate","matrix","fivemin","todo"], ans:"nohate",
    note:"他卡住的地方很具体：<b>没有选项</b>，不是没有动力。这时候追问“你到底喜欢什么”只会把人问得更僵。把问题换成“你不讨厌什么”，门槛一下就降下来了。" },

  { who:"病例 04 · 高二 · 小满",
    say:"老师说周三交的表格、妈妈让我带的钥匙、答应同学还的书……我总会漏掉一两件，而且每次都是在来不及的时候才想起来。",
    opts:["todo","matrix","pomodoro","comfort"], ans:"todo",
    note:"她的动力、专注、排序都没问题，唯一漏的是<b>存储</b>。这是最容易被“我记性不好”糊弄过去的一类问题——它其实跟记性无关，跟有没有一个可靠的外部收件箱有关。" },

  { who:"病例 05 · 高一 · 阿哲",
    say:"我的清单上有十四件事，每一件看起来都很急。我盯着清单看了十分钟，越看越慌，最后拿起手机刷了四十分钟。",
    opts:["matrix","todo","freewrite","fivemin"], ans:"matrix",
    note:"注意：他<b>已经有清单了</b>，所以问题不在记录。他卡在“排序”这一步。慌是结果不是原因，原因是十四件事没有一个筛选标准——清单只负责记下来，排序需要另一套工具。" },

  { who:"病例 06 · 初三 · 小鹿",
    say:"我知道今晚要背第五单元的单词，书也翻开了。但我一直想着“再等一下、看完这条就开始”，一等就等到了十一点。",
    opts:["fivemin","pomodoro","matrix","comfort"], ans:"fivemin",
    note:"她知道做什么，也知道先做什么，任务也不大。唯一缺的是<b>跨过“开始”那一步</b>。这类拖延不需要更强的决心，只需要一个便宜到无法拒绝的入口：五分钟。" },

  { who:"病例 07 · 高二 · 阿树",
    say:"我坐下了，也确实开始写了。可是写着写着，我就在想中午吃什么、周末去哪儿。等我回过神，四十分钟过去了，纸上还是那两行。",
    opts:["pomodoro","fivemin","freewrite","nohate"], ans:"pomodoro",
    note:"他已经启动了，所以五分钟启动法帮不上忙。问题发生在<b>启动之后</b>——注意力留不住。番茄钟的核心不是逼你专注，是给走神一个处理流程：记一笔，回来。" },

  { who:"病例 08 · 高一 · 小雨 · 进阶",
    say:"我有清单，也排好了优先级，第一件事就是写作文。我准时坐下开始写了。但每隔几分钟就要看一眼手机，一个晚上过去，作文写了半段。",
    opts:["pomodoro","todo","matrix","fivemin"], ans:"pomodoro",
    note:"这题在考“排除法”：记下来 ✓ 排好序 ✓ 启动了 ✓。前三步她全做对了，唯一漏掉的是<b>在过程中把注意力留住</b>。诊断的关键，永远是找到那个还没被覆盖的环节。" },

  { who:"病例 09 · 初二 · 阿凯 · 进阶",
    say:"我给自己定了每天跑十公里，头两天咬牙跑完了，第三天开始不想起床，现在连跑鞋都不想看。",
    opts:["comfort","fivemin","pomodoro","todo"], ans:"comfort",
    note:"五分钟启动法能救急一次，但病根在<b>目标本身被定在了恐慌圈</b>。目标一旦超出学习区，靠意志力只能撑几天。把十公里改成两公里——一个能坚持一个月的方案，永远强过一个坚持三天的方案。" },

  { who:"病例 10 · 高三 · 小行 · 组合题",
    say:"我心里堆着一大摊事，越想越烦，越烦越不想动，越不想动就越焦虑。现在我连自己到底有哪些事都说不清楚了。",
    opts:["freewrite","todo","matrix","pomodoro"], ans:"freewrite",
    note:"这题是一串组合技，顺序才是考点：<b>自由书写 → To Do List → 四象限</b>。如果你投了 To Do List，不算错，只是站错了位置：情绪堵在前面的时候，人是写不出清单的——因为他连有哪些事都说不清。先倒空，再整理，最后排序。" }
];

/* ═══════════════ 状态 ═══════════════ */
let idx = 0;                     // 当前病例
let phase = "cover";             // cover | brief | vote | reveal | end
let votes = [0,0,0,0];
let hits = 0, done = 0;
let timeLeft = 0, timerOn = false, tick = null;

const stage = document.getElementById("stage");
const ctrls = document.getElementById("ctrls");

/* ═══════════════ 心电图（签名元素）═══════════════ */
const cv = document.getElementById("ecg"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
let buf = [], beatAt = 0, pulse = 0, mode = "idle";
function sizeCanvas(){
  const r = devicePixelRatio || 1;
  cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
  cx.setTransform(r,0,0,r,0,0);
  const n = Math.ceil(cv.clientWidth / 2);
  while(buf.length < n) buf.unshift(0);
  buf = buf.slice(-n);
}
addEventListener("resize", sizeCanvas);
function beatShape(t){ // t: 0..1 一个心跳周期
  if(t<.06) return -.12*Math.sin(t/.06*Math.PI);
  if(t<.10) return  1.00*Math.sin((t-.06)/.04*Math.PI);
  if(t<.16) return -.34*Math.sin((t-.10)/.06*Math.PI);
  if(t<.34) return  .22*Math.sin((t-.16)/.18*Math.PI);
  return 0;
}
let phaseT = 0;
function drawECG(){
  const w = cv.clientWidth, h = cv.clientHeight, mid = h*.55, amp = h*.36;
  const period = mode==="fast" ? 34 : mode==="flat" ? 999 : 58;
  phaseT += 1;
  let v = mode==="flat" ? 0 : beatShape((phaseT % period)/period);
  if(pulse>0){ v += pulse; pulse *= .78; if(pulse<.01) pulse=0; }
  buf.push(v); buf.shift();
  cx.clearRect(0,0,w,h);
  cx.strokeStyle = "rgba(61,220,151,.16)"; cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(0,mid); cx.lineTo(w,mid); cx.stroke();
  cx.strokeStyle = mode==="alert" ? "#ffb454" : "#3ddc97";
  cx.lineWidth = 2; cx.lineJoin="round";
  cx.shadowColor = cx.strokeStyle; cx.shadowBlur = 10;
  cx.beginPath();
  for(let i=0;i<buf.length;i++){
    const x = i*2, y = mid - buf[i]*amp;
    i ? cx.lineTo(x,y) : cx.moveTo(x,y);
  }
  cx.stroke(); cx.shadowBlur = 0;
  requestAnimationFrame(drawECG);
}
sizeCanvas();
if(!reduce){ requestAnimationFrame(drawECG); }
else{ const w=cv.clientWidth,h=cv.clientHeight; cx.strokeStyle="#3ddc97"; cx.beginPath(); cx.moveTo(0,h*.55); cx.lineTo(w,h*.55); cx.stroke(); }

/* ═══════════════ 计时器 ═══════════════ */
function startTimer(s){ timeLeft = s; timerOn = true; paintClock(); }
function stopTimer(){ timerOn = false; }
function paintClock(){
  const c = document.getElementById("clock");
  if(phase==="cover"||phase==="end"){ c.textContent="--:--"; c.className="clock"; return; }
  const m = String(Math.floor(timeLeft/60)).padStart(2,"0"), s = String(timeLeft%60).padStart(2,"0");
  c.textContent = m+":"+s;
  c.className = "clock" + (timeLeft===0 ? " zero" : timeLeft<=10 ? " low" : "");
}
tick = setInterval(()=>{ if(timerOn && timeLeft>0){ timeLeft--; paintClock(); if(timeLeft===0) mode="alert"; } },1000);

/* ═══════════════ 渲染 ═══════════════ */
function readout(){
  document.getElementById("rdCase").textContent = (phase==="cover"||phase==="end") ? "--" : (idx+1)+" / "+CASES.length;
  document.getElementById("rdAcc").textContent = done ? hits+" / "+done : "--";
  document.getElementById("rdVotes").textContent = votes.reduce((a,b)=>a+b,0);
}
function optHTML(mini){
  const c = CASES[idx], total = Math.max(1, votes.reduce((a,b)=>a+b,0));
  const top = Math.max(...votes);
  return `<div class="opts${mini?" mini":""}">` + c.opts.map((k,i)=>{
    const m = M[k], pct = mini ? 0 : votes[i]/total*100;
    const cls = phase==="reveal" ? (k===c.ans ? " correct locked" : " faded locked") : "";
    return `<button class="opt${cls}" data-i="${i}">
      <span class="fill" style="width:${votes[i]?pct:0}%"></span>
      <span class="key">${i+1}</span>
      <span class="name">${m.name}<span class="sub">${m.one}</span></span>
      <span class="cnt">${votes[i]}</span>
      ${(phase==="reveal"&&k===c.ans&&!mini)?'<span class="tag">最对症</span>':""}
    </button>`;
  }).join("") + `</div>`;
}
function bindOpts(){
  stage.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click", e=>{
      if(phase!=="vote") return;
      const i = +b.dataset.i;
      votes[i] += e.shiftKey ? -1 : 1;
      if(votes[i]<0) votes[i]=0;
      pulse = .85; mode = "fast";
      updateVotes();
    });
  });
}
function updateVotes(){
  const total = Math.max(1, votes.reduce((a,b)=>a+b,0));
  stage.querySelectorAll(".opt").forEach(b=>{
    const i = +b.dataset.i;
    b.querySelector(".cnt").textContent = votes[i];
    b.querySelector(".fill").style.width = (votes[i] ? votes[i]/total*100 : 0) + "%";
  });
  readout();
}

function render(){
  readout(); paintClock();
  if(phase==="cover"){
    mode="idle";
    stage.innerHTML = `<div class="cover">
      <div class="kicker">学 习 方 法 · 大 屏 会 诊</div>
      <h1>学习方法<br><em>急诊室</em></h1>
      <p>今天你们不是学生，是这间急诊室的会诊医生。十位病人会依次进来，每人说一句话。你们要做的只有一件事：听懂他到底卡在哪一步，然后<strong>全体投票</strong>，开出那一味最对症的药。</p>
      <ul>
        <li><b>10</b> 位病人</li>
        <li><b>7</b> 味处方</li>
        <li><b>1</b> 块大屏，一起投票</li>
      </ul>
    </div>`;
    ctrls.innerHTML = btn("开始接诊","primary","next") + btn("先看七味处方总表","","sheet") + hint();
  }

  else if(phase==="brief"){
    mode="idle";
    const c = CASES[idx];
    stage.innerHTML = `
      <div class="eyebrow">主诉 · 先别急着投票，同桌讨论一分钟</div>
      <div class="chart"><div class="who">${c.who}</div><div class="say">${c.say}</div></div>`;
    ctrls.innerHTML = btn("放出四个选项","primary","next") + btn("+30 秒","","addtime") + btn("上一位","","prev") + hint();
  }

  else if(phase==="vote"){
    mode="idle";
    const c = CASES[idx];
    stage.innerHTML = `
      <div class="chart compact"><div class="who">${c.who}</div><div class="say">${c.say}</div></div>
      <div class="eyebrow">举手表决 · 点选项卡片 或 按数字键 1–4 计票（按住 Shift 点击可减一）</div>
      ${optHTML(false)}`;
    bindOpts();
    ctrls.innerHTML = btn("揭晓处方","primary","next") + btn("清零重投","","reset") + btn("回到主诉","","back") + hint();
  }

  else if(phase==="reveal"){
    const c = CASES[idx], m = M[c.ans];
    stage.innerHTML = `
      <div class="chart compact"><div class="who">${c.who}</div><div class="say">${c.say}</div></div>
      ${optHTML(true)}
      <div class="rx">
        <div class="rx-head"><h2>${m.name}</h2><span class="for">对症 · ${m.sym}</span></div>
        <div class="rx-cols">
          <div><h3>为什么有用</h3><p>${m.why}</p>
            <div class="note">诊断要点：${c.note}</div></div>
          <div><h3>怎么做</h3><ol>${m.how.map(s=>`<li>${s}</li>`).join("")}</ol>
            <div class="oneline">${m.one}</div></div>
        </div>
      </div>`;
    ctrls.innerHTML = btn(idx===CASES.length-1 ? "查看会诊报告" : "下一位病人","primary","next") + btn("七味总表","","sheet") + hint();
  }

  else if(phase==="end"){
    mode="idle";
    const pct = done ? hits/done : 0;
    const rank = pct>=.9 ? ["主任医师","看穿症状背后的机制，你们已经能给别人看病了。"]
              : pct>=.7 ? ["主治医师","大方向都对。剩下的失误多半出在“顺序”上——同样的药，先后不同，效果不同。"]
              : pct>=.5 ? ["住院医师","能认出症状，还不太能区分相邻的两味药。回头重点看第 5、8、10 题。"]
                        : ["实习医生","别急，认错药说明你们真的在推理，而不是在猜。七味药再过一遍。"];
    stage.innerHTML = `
      <div class="eyebrow">会诊报告</div>
      <div class="score-row">
        <div class="score-big">${hits}<small>/${done}</small></div>
        <div class="rank"><span>本班评级</span>${rank[0]}</div>
      </div>
      <p style="font-family:var(--serif);font-size:clamp(15px,1.5vw,24px);line-height:1.7;max-width:60ch;opacity:.85">${rank[1]}</p>
      <div class="grid7">${ORDER.map(k=>card7(k)).join("")}</div>
      <div class="eyebrow" style="margin-top:.6em">最后一题，没有选项：在纸上写下<strong style="color:var(--paper)">你自己这周的一条主诉</strong>，交给同桌开处方。</div>`;
    ctrls.innerHTML = btn("再来一轮","primary","restart") + btn("七味总表","","sheet") + hint();
  }
}
function card7(k){
  const m = M[k];
  return `<div class="card7"><div class="sym">${m.sym}</div><div class="nm">${m.name}</div><div class="ol">${m.one}</div></div>`;
}
function btn(label,cls,act){ return `<button class="ctl ${cls}" data-act="${act}">${label}</button>`; }
function hint(){ return `<span class="hint"><kbd>空格</kbd>下一步 <kbd>1-4</kbd>计票 <kbd>R</kbd>清零 <kbd>M</kbd>总表</span>`; }

/* ═══════════════ 流程 ═══════════════ */
function next(){
  if(phase==="cover"){ idx=0; votes=[0,0,0,0]; phase="brief"; startTimer(60); }
  else if(phase==="brief"){ phase="vote"; startTimer(30); }
  else if(phase==="vote"){
    const total = votes.reduce((a,b)=>a+b,0);
    if(total>0){
      const c = CASES[idx], top = Math.max(...votes);
      const ansIdx = c.opts.indexOf(c.ans);
      done++; if(votes[ansIdx]===top) hits++;
      mode = votes[ansIdx]===top ? "fast" : "alert";
      pulse = 1;
    }
    stopTimer(); phase="reveal";
  }
  else if(phase==="reveal"){
    if(idx===CASES.length-1){ phase="end"; }
    else { idx++; votes=[0,0,0,0]; phase="brief"; startTimer(60); }
  }
  else if(phase==="end"){ return; }
  render();
}
ctrls.addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="next") next();
  else if(a==="reset"){ votes=[0,0,0,0]; updateVotes(); }
  else if(a==="back"){ phase="brief"; startTimer(60); render(); }
  else if(a==="prev"){ if(idx>0){ idx--; votes=[0,0,0,0]; phase="brief"; startTimer(60); render(); } }
  else if(a==="addtime"){ timeLeft += 30; timerOn=true; mode="idle"; paintClock(); }
  else if(a==="sheet") toggleSheet();
  else if(a==="restart"){ idx=0; hits=0; done=0; votes=[0,0,0,0]; phase="cover"; stopTimer(); render(); }
});

/* 浮层 */
document.getElementById("sheetGrid").innerHTML = ORDER.map(k=>{
  const m = M[k];
  return `<div class="card7"><div class="sym">${m.sym}</div><div class="nm">${m.name}</div><div class="ol">${m.why.slice(0,58)}…<br><br><span style="color:var(--mint)">${m.one}</span></div></div>`;
}).join("");
function toggleSheet(){ document.getElementById("sheet").classList.toggle("on"); }

/* 键盘 */
addEventListener("keydown", e=>{
  if(e.key==="m"||e.key==="M"){ toggleSheet(); return; }
  if(document.getElementById("sheet").classList.contains("on")){ if(e.key==="Escape") toggleSheet(); return; }
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); next(); return; }
  if(e.key==="r"||e.key==="R"){ if(phase==="vote"){ votes=[0,0,0,0]; updateVotes(); } return; }
  if(e.key==="p"||e.key==="P"){ timerOn=!timerOn; return; }
  if(phase==="vote" && e.key>="1" && e.key<="4"){
    const i = +e.key-1; votes[i]++; pulse=.85; mode="fast"; updateVotes();
  }
  if(phase==="vote" && ["!","@","#","$"].includes(e.key)){
    const i = ["!","@","#","$"].indexOf(e.key); votes[i]=Math.max(0,votes[i]-1); updateVotes();
  }
});

render();
</script>
</body>
</html>
