<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人性实验室 · 行为经济学现场课 | 钥匙玩校 kiidschool</title>
<style>
:root{
  --void:#11151b; --slab:#1a2029; --edge:rgba(240,236,225,.12);
  --chalk:#f0ece1; --dim:#8d99ab; --signal:#f2a03d;
  --ga:#e2635c; --gb:#49aec7;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--chalk);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(240,236,225,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(240,236,225,.022) 1px,transparent 1px);
  background-size:52px 52px}
#deck{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:4.5vh 5vw 13vh;opacity:0;pointer-events:none;transition:opacity .35s ease}
.slide.on{opacity:1;pointer-events:auto}

.eyebrow{display:flex;align-items:baseline;gap:1.1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--edge);padding-bottom:.9rem;margin-bottom:1.8rem}
.no{font-family:var(--mono);font-size:clamp(1.5rem,3.2vw,2.4rem);color:var(--signal);
  font-weight:700;letter-spacing:.04em;line-height:1}
.ttl{font-size:clamp(1.3rem,2.8vw,2.2rem);font-weight:700;letter-spacing:.02em}
.tag{font-family:var(--mono);font-size:clamp(.68rem,1.15vw,.9rem);color:var(--dim);
  border:1px solid var(--edge);padding:.28em .7em;border-radius:2px;letter-spacing:.06em}
.act{font-family:var(--mono);font-size:clamp(.64rem,1.05vw,.82rem);color:var(--signal);letter-spacing:.11em}
.by{font-family:var(--mono);font-size:clamp(.66rem,1.05vw,.82rem);color:var(--dim);margin-left:auto}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.body.top{justify-content:flex-start}
.stage{display:none;animation:rise .4s ease}
.stage.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.curtain{border:2px solid;border-radius:4px;padding:.8rem 1.3rem;margin-bottom:1.6rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.curtain .dot{width:14px;height:14px;border-radius:50%;flex:none}
.curtain .look{font-size:clamp(1rem,2vw,1.5rem);font-weight:800}
.curtain .shut{font-family:var(--mono);font-size:clamp(.76rem,1.3vw,1.02rem);color:var(--dim);
  margin-left:auto;letter-spacing:.06em}
.curtain.r{border-color:var(--ga);background:rgba(226,99,92,.09)}
.curtain.r .dot{background:var(--ga)} .curtain.r .look{color:var(--ga)}
.curtain.b{border-color:var(--gb);background:rgba(73,174,199,.09)}
.curtain.b .dot{background:var(--gb)} .curtain.b .look{color:var(--gb)}

.solo{max-width:56rem}
.q{font-size:clamp(1rem,1.9vw,1.55rem);line-height:1.7;margin-bottom:1.4rem}
.opts{list-style:none;display:flex;flex-direction:column;gap:.65rem}
.opts li{border:1px solid var(--edge);background:var(--slab);padding:.8rem 1.05rem;
  border-radius:3px;font-size:clamp(.92rem,1.65vw,1.26rem);line-height:1.5}
.r-side .opts li{border-left:3px solid var(--ga)}
.b-side .opts li{border-left:3px solid var(--gb)}
.tally{margin-top:1.6rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  border-top:1px dashed var(--edge);padding-top:1.2rem}
.tally .lb{font-family:var(--mono);font-size:clamp(.76rem,1.25vw,.98rem);letter-spacing:.1em;color:var(--dim)}

.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.pane{padding:1.4rem 2rem}
.pane .who{font-family:var(--mono);font-size:clamp(.78rem,1.35vw,1.02rem);letter-spacing:.14em;
  font-weight:700;margin-bottom:.9rem}
.pane.a .who{color:var(--ga)} .pane.b .who{color:var(--gb)}
.pane .q{font-size:clamp(.92rem,1.55vw,1.2rem);margin-bottom:1rem}
.pane .opts li{font-size:clamp(.86rem,1.45vw,1.08rem)}
.pane.a .opts li{border-left:3px solid var(--ga)}
.pane.b .opts li{border-left:3px solid var(--gb)}
.seam{width:1px;background:linear-gradient(transparent,var(--edge) 12%,var(--edge) 88%,transparent);position:relative}
.seam span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);
  white-space:nowrap;font-family:var(--mono);font-size:.7rem;letter-spacing:.3em;
  color:var(--dim);background:var(--void);padding:.5em .8em}

.panel{background:var(--slab);border:1px solid var(--edge);border-radius:4px;padding:1.6rem 1.8rem}
.panel h4{font-family:var(--mono);font-size:.76rem;letter-spacing:.22em;color:var(--dim);
  font-weight:600;margin-bottom:1.2rem}
.inrow{display:flex;align-items:center;gap:.65rem;margin-bottom:.95rem;flex-wrap:wrap}
.inrow label{flex:1;min-width:12rem;font-size:clamp(.88rem,1.45vw,1.06rem)}
.swatch{width:10px;height:10px;border-radius:50%;flex:none}
input[type=number]{width:5.2rem;background:transparent;border:none;border-bottom:2px solid var(--edge);
  color:var(--signal);font-family:var(--mono);font-size:clamp(1.25rem,2.3vw,1.85rem);
  font-weight:700;text-align:center;padding:.1em 0}
input[type=number]:focus{outline:none;border-bottom-color:var(--signal)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.unit{font-family:var(--mono);color:var(--dim);font-size:.92rem}

.rosters{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-bottom:1.6rem}
.rblock{background:var(--slab);border:1px solid var(--edge);border-radius:4px;padding:1rem 1.1rem}
.rhead{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;margin-bottom:.8rem;
 padding-bottom:.6rem;border-bottom:1px solid var(--edge)}
.rhead .rn{font-size:clamp(.85rem,1.35vw,1.02rem);font-weight:700}
.rstat{margin-left:auto;font-family:var(--mono);font-size:clamp(.72rem,1.15vw,.9rem);color:var(--dim);white-space:nowrap}
.rstat b{color:var(--signal);font-size:clamp(.88rem,1.5vw,1.15rem)}
.rgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:.3rem}
input.cell{width:100%;background:rgba(240,236,225,.04);border:1px solid var(--edge);border-radius:2px;
 color:var(--chalk);font-family:var(--mono);font-size:clamp(.72rem,1.15vw,.92rem);font-weight:600;
 text-align:center;padding:.34em .1em}
input.cell:focus{outline:none;border-color:var(--signal);background:rgba(242,160,61,.1)}
input.cell:not(:placeholder-shown){border-color:rgba(242,160,61,.45)}
.rtip{font-size:clamp(.74rem,1.15vw,.9rem);color:var(--dim);line-height:1.6;margin-top:.7rem}
.bars{display:flex;flex-direction:column;gap:.9rem}
.barrow{display:grid;grid-template-columns:minmax(9rem,16rem) 1fr auto;gap:1rem;align-items:center}
.barlab{font-size:clamp(.82rem,1.35vw,1.02rem);line-height:1.4}
.bartrack{height:clamp(20px,3.1vh,34px);background:rgba(240,236,225,.05);border-radius:2px;overflow:hidden}
.barfill{height:100%;width:0;border-radius:2px;transition:width .65s cubic-bezier(.22,.9,.3,1)}
.barval{font-family:var(--mono);font-weight:700;font-size:clamp(.95rem,1.8vw,1.45rem);min-width:4.4rem;text-align:right}
.barrow.ghost .bartrack{background:transparent;border:1px solid var(--edge)}
.barrow.ghost .barfill{background:repeating-linear-gradient(-45deg,
  rgba(240,236,225,.3) 0 5px,transparent 5px 10px);border:1px solid rgba(240,236,225,.35)}
.barrow.ghost .barval,.barrow.ghost .barlab{color:var(--dim)}

.split{display:grid;grid-template-columns:1.15fr .85fr;gap:2.2rem;align-items:start}
.split.even{grid-template-columns:1fr 1fr}
.blockttl{font-family:var(--mono);font-size:.74rem;letter-spacing:.2em;color:var(--dim);margin-bottom:1rem}
.punch{font-size:clamp(1.05rem,2vw,1.55rem);line-height:1.65;font-weight:600;
  border-left:3px solid var(--signal);padding-left:1.15rem;margin-bottom:1.4rem}
.points{list-style:none;display:flex;flex-direction:column;gap:.8rem}
.points li{font-size:clamp(.85rem,1.4vw,1.06rem);line-height:1.65;color:#ded8cb;padding-left:1.5rem;position:relative}
.points li::before{content:"—";position:absolute;left:0;color:var(--signal);font-family:var(--mono)}

.cover{justify-content:center;align-items:flex-start}
.kicker{font-family:var(--mono);letter-spacing:.4em;color:var(--signal);font-size:clamp(.72rem,1.25vw,.95rem);margin-bottom:1.5rem}
h1{font-size:clamp(2.4rem,7.4vw,6rem);line-height:.98;letter-spacing:-.02em;font-weight:800}
h1 em{font-style:normal;color:var(--signal)}
.sub{font-size:clamp(.98rem,1.8vw,1.42rem);color:var(--dim);line-height:1.75;margin-top:1.6rem;max-width:46ch}
h2{font-size:clamp(1.6rem,3.6vw,2.8rem);font-weight:800;letter-spacing:-.01em;line-height:1.18;margin-bottom:1.2rem}
h2 em{font-style:normal;color:var(--signal)}
.lede{font-size:clamp(.94rem,1.6vw,1.22rem);line-height:1.78;color:#d6d0c4;max-width:66ch;margin-bottom:1.5rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.9rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:.9rem}
.card{background:var(--slab);border:1px solid var(--edge);border-radius:4px;padding:1.1rem 1.3rem;border-top:2px solid var(--signal)}
.card .cno{font-family:var(--mono);color:var(--signal);font-size:.74rem;letter-spacing:.13em;margin-bottom:.45rem}
.card .ch{font-size:clamp(.95rem,1.5vw,1.14rem);font-weight:700;margin-bottom:.4rem}
.card p{font-size:clamp(.8rem,1.28vw,.95rem);line-height:1.62;color:var(--dim)}
.card p.lit{color:#ded8cb}
.card p.eg{margin-top:.7rem;padding-top:.6rem;border-top:1px dashed var(--edge);color:#c9c3b6;
 font-size:clamp(.78rem,1.22vw,.92rem)}
.card p.eg b{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;
 color:var(--signal);border:1px solid var(--signal);border-radius:2px;padding:.05em .45em;margin-right:.5em}
.actband{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:1.3rem 0 .8rem;
  border-top:1px solid var(--edge);padding-top:.8rem}
.actband:first-child{margin-top:0;border-top:none;padding-top:0}
.actband b{font-family:var(--mono);color:var(--signal);font-size:clamp(.74rem,1.2vw,.92rem);letter-spacing:.12em}
.actband span{font-size:clamp(.8rem,1.3vw,.98rem);color:var(--dim);line-height:1.6}

.sys{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.sysbox{border:1px solid var(--edge);border-radius:4px;padding:1.5rem 1.7rem;background:var(--slab)}
.sysbox.one{border-top:3px solid var(--ga)}
.sysbox.two{border-top:3px solid var(--gb)}
.sysbox h3{font-size:clamp(1.2rem,2.4vw,1.85rem);margin-bottom:.25rem}
.sysbox .tagline{font-family:var(--mono);font-size:.76rem;letter-spacing:.16em;color:var(--dim);margin-bottom:1rem}
.sysbox ul{list-style:none;display:flex;flex-direction:column;gap:.58rem}
.sysbox li{font-size:clamp(.84rem,1.33vw,1rem);line-height:1.58;color:#ded8cb}
.sysbox li b{color:var(--chalk)}

.wheel{width:clamp(150px,24vh,240px);height:auto;display:block;margin:.2rem 0 1.2rem}
.qvis{display:flex;align-items:center;gap:2.2rem;flex-wrap:wrap}
.qvis>div{flex:1;min-width:22rem}
.pt{width:100%;height:auto;max-height:48vh;display:block}
.pt text{font-family:var(--mono);font-size:13px;fill:var(--dim)}
.pt .em{fill:var(--chalk);font-weight:700;font-size:14px}
.laws{list-style:none;display:flex;flex-direction:column;gap:.95rem}
.laws li{border-left:3px solid var(--signal);padding-left:1.05rem}
.laws b{display:block;font-size:clamp(.96rem,1.5vw,1.16rem);margin-bottom:.3rem}
.laws p{font-size:clamp(.82rem,1.28vw,.98rem);line-height:1.68;color:#ded8cb}

.mwrap{display:grid;grid-template-columns:auto 1fr;gap:2.4rem;align-items:center}
.mandala{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:min(48vh,44vw,28rem);aspect-ratio:1}
.mcell{background:var(--slab);border:1px solid var(--edge);border-radius:2px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.35rem;gap:.18rem}
.mcell .jp{font-family:var(--mono);font-size:clamp(.48rem,.8vw,.68rem);color:var(--dim);line-height:1.2}
.mcell .cn{font-size:clamp(.72rem,1.28vw,1.02rem);font-weight:700;line-height:1.25}
.mcell.core{background:var(--signal);border-color:var(--signal);color:var(--void)}
.mcell.core .jp{color:rgba(17,21,27,.68)}
.mcell.hot{border:2px solid var(--signal)}
.mcell.hot .cn{color:var(--signal)}
.mcell.blank{border-style:dashed;background:transparent}
.mpair{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem}
.mpair .mandala{width:100%;max-width:24rem}
.mcap{font-family:var(--mono);font-size:.78rem;letter-spacing:.16em;color:var(--signal);margin-bottom:.8rem}

.map{display:flex;flex-direction:column}
.maprow{display:grid;grid-template-columns:minmax(6rem,9rem) minmax(5.2rem,7.5rem) 1fr;
  gap:1.1rem;padding:.6rem 0;border-top:1px solid var(--edge);align-items:baseline}
.maprow:last-child{border-bottom:1px solid var(--edge)}
.mact{font-weight:700;font-size:clamp(.85rem,1.4vw,1.06rem)}
.mmech{font-family:var(--mono);font-size:clamp(.7rem,1.1vw,.86rem);color:var(--signal)}
.mwhy{font-size:clamp(.79rem,1.25vw,.96rem);line-height:1.6;color:#ded8cb}

.qwall{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:1rem}
.quote{background:var(--slab);border:1px solid var(--edge);border-left:3px solid var(--signal);
  border-radius:4px;padding:1.15rem 1.35rem;display:flex;flex-direction:column;gap:.55rem}
.quote .qt{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;color:var(--signal)}
.quote .qz{font-size:clamp(.96rem,1.55vw,1.18rem);line-height:1.62;font-weight:600}
.quote .qw{font-family:var(--mono);font-size:clamp(.72rem,1.1vw,.86rem);color:var(--dim)}
.quote .qb{font-size:clamp(.79rem,1.22vw,.94rem);line-height:1.6;color:#ded8cb;
  border-top:1px dashed var(--edge);padding-top:.55rem}

.stagebar{position:absolute;left:5vw;bottom:6.5vh;display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}
.sbtn{font-family:var(--mono);font-size:.8rem;letter-spacing:.09em;color:var(--dim);background:transparent;
  border:1px solid var(--edge);border-radius:2px;padding:.52em .95em;cursor:pointer;transition:.2s}
.sbtn:hover{color:var(--chalk);border-color:var(--dim)}
.sbtn.on{color:var(--void);background:var(--signal);border-color:var(--signal);font-weight:700}
.sbtn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

#rail{position:absolute;left:0;right:0;bottom:0;height:5.5vh;min-height:38px;display:flex;align-items:center;

#brandmark{width:4.4vh;height:4.4vh;min-width:22px;min-height:22px}

#rail #brand{display:flex;align-items:center;gap:.55rem}
#brand{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--signal);white-space:nowrap}
#ticks{display:flex;gap:3px;flex:1}
.tick{flex:1;height:5px;background:rgba(240,236,225,.13);border-radius:1px;cursor:pointer;transition:.25s;border:none;padding:0}
.tick:hover{background:rgba(240,236,225,.35)}

.tick.now{background:var(--signal);height:11px}
.tick.brk{margin-left:15px}
#pg{font-family:var(--mono);font-size:.74rem;color:var(--dim);letter-spacing:.1em;white-space:nowrap}
#keys{font-family:var(--mono);font-size:.68rem;color:rgba(141,153,171,.6);letter-spacing:.06em;white-space:nowrap}

#hint{position:absolute;right:5vw;top:4.5vh;width:min(26rem,42vw);background:#232b36;border:1px solid var(--signal);
  border-radius:4px;padding:1.1rem 1.3rem;z-index:20;box-shadow:0 18px 50px rgba(0,0,0,.55);display:none}
#hint.on{display:block}
#hint .hl{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;color:var(--signal);margin-bottom:.6rem}
#hint p{font-size:.95rem;line-height:1.7}

  .mandala{width:min(38vh,40vw,21rem)}

  .mcap{margin-bottom:.5rem}
}

  .slide{padding:3.4vh 5vw 12vh}

  .board,.split,.sys,.mpair,.split.even{grid-template-columns:1fr;gap:1.4rem}

}

/* 转盘：视觉锚，全程无声 */
function WHEEL(v,color){
 const cx=132,cy=132,R=98;
 let ticks="";
 for(let t=0;t<=100;t+=5){
  const a=(-90+t*3.6)*Math.PI/180, big=(t%25===0);
  const r1=R-(big?16:8);
  ticks+=`<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+R*Math.cos(a)}" y2="${cy+R*Math.sin(a)}" stroke="rgba(240,236,225,${big?.5:.25})" stroke-width="${big?2:1}"/>`;
  if(big){const rt=R-30;ticks+=`<text x="${cx+rt*Math.cos(a)}" y="${cy+rt*Math.sin(a)+4}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="var(--dim)">${t}</text>`;}
 }
 const ang=(-90+v*3.6)*Math.PI/180;
 return `<svg class="wheel" viewBox="0 0 264 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="转盘停在 ${v}">
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--edge)" stroke-width="2"/>
  ${ticks}
  <line x1="${cx}" y1="${cy}" x2="${cx+(R-6)*Math.cos(ang)}" y2="${cy+(R-6)*Math.sin(ang)}" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cy}" r="7" fill="${color}"/>
  <text x="${cx}" y="${cy+52}" text-anchor="middle" font-family="var(--mono)" font-size="52" font-weight="700" fill="${color}">${v}</text>
 </svg>`;
}

 return `<div class="stage" data-s="${i}">
  <div class="curtain ${side}"><span class="dot"></span><span class="look">${name}　睁眼看题</span>
   <span class="shut">${other} 请闭眼 · 或转身背对屏幕</span></div>

    ? `<div class="qvis">${e.cards[i].visual}<div><div class="q">${e.cards[i].q}</div>
        <ul class="opts">${e.cards[i].opts.map(o=>`<li>${o}</li>`).join('')}</ul></div></div>`
    : `<div class="q">${e.cards[i].q}</div>

   <div class="tally"><span class="lb">${e.asks[i]}</span>${field(ei,i,e)}</div></div></div>`;
}

function roster(e,ei){
 const blocks=e.rows.map((r,i)=>{
  const cells=Array.from({length:e.slots},(_,k)=>
    `<input class="cell" type="number" step="any" data-e="${ei}" data-i="${i}" data-k="c" placeholder="">`).join('');
  return `<div class="rblock">
    <div class="rhead"><span class="swatch" style="background:${r.c}"></span>
     <span class="rn">${e.asks[i]}</span>
     <span class="rstat" id="st${ei}${i}">已录入 <b>0</b> 人 · 平均 <b>—</b> · 中位 <b>—</b></span></div>
    <div class="rgrid">${cells}</div></div>`;}).join('');
 return `<div class="rosters">${blocks}</div>
  <p class="rtip">每格填一个人的数字，回车自动跳下一格，留空的不计入。平均数和中位数实时算，柱子跟着平均数走。
  如果两个数字差很多，那正是一个好问题：<b style="color:var(--signal)">是谁把平均数拉飞了？</b></p>`;
}
function expSlide(e,ei){
 if(e.mode==='blind')
  return head(e)+`<div class="body">${soloStage(e,ei,0)}${soloStage(e,ei,1)}
   <div class="stage" data-s="2">${compareBlock(e)}</div>
   <div class="stage" data-s="3">${reveal(e)}</div></div>`;
 const tally=e.slots
   ? `<div class="body top"><div class="stage" data-s="0">${compareBlock(e)}</div>
      <div class="stage" data-s="1">${roster(e,ei)}${bars(e.rows,false)}</div>
      <div class="stage" data-s="2">${reveal(e)}</div></div>`
   : `<div class="body"><div class="stage" data-s="0">${compareBlock(e)}</div>
      <div class="stage" data-s="1"><div class="split">
        <div><div class="blockttl">本班现场数据</div>${bars(e.rows,false)}</div>
        <div class="panel"><h4>录入</h4>${e.rows.map((r,i)=>`<div class="inrow">

        </div></div></div>
      <div class="stage" data-s="2">${reveal(e)}</div></div>`;
 return head(e)+tally;
}

SLIDES.push({stages:1,host:"收尾三招。第三招最值得多花一分钟——它直接指向考前复习最常见的坏习惯，学生听到这里一般会有点心虚。",

SLIDES.push({stages:2,labs:['① 回忆','② 思考题'],
 host:"第一阶段两两一组各说 2 分钟，你只管掐表。第二阶段的思考题不用当场回答——它是这周的作业，也是两页之后九宫格中心那一格要填的东西。",
 html:`<div class="eyebrow"><span class="no">13</span><span class="ttl">用它来做点真的决定</span><span class="tag">回忆 + 思考题</span></div>
 <div class="body top">
  <div class="stage" data-s="0">
   <h2>你最重大的那个决定，<em>理由是真的吗</em></h2>

   <div class="punch" style="margin-top:1.4rem">很多人会发现：系统 1 早就把决定做完了，系统 2 只是事后被叫来写了一篇作文。<br>
   这不丢人。丢人的是下次还这样，而且还是不知道。</div>
  </div>
  <div class="stage" data-s="1">

SLIDES.push({stages:1,host:"过渡页，慢慢讲。核心那句是最后一行：这些偏差加起来，日常里有个通俗的名字。念完停三秒再翻页，别急着接。",
 html:`<div class="eyebrow"><span class="no">14</span><span class="ttl">还有一批系统 1，正在评估你</span><span class="tag">从自己转向别人</span></div>
 <div class="body top">
 <h2>到这里，我们只修好了<em>一半</em></h2>

 可是教室里、球场上、公司里，每时每刻还有另外几十个系统 1 在运转——而它们评估的对象是你。第四幕的最后通牒，就是给这半场留的门。</p>

 <div class="punch">别人的系统 1 每天替你做几十次微小的判决：要不要多解释一句、要不要把机会先给你、那个 50/50 的球算谁的。<br>

   <p class="lede" style="margin-top:1.3rem;max-width:none">
   看「运气」那一格里的八条：打招呼、捡垃圾、打扫房间、爱惜球具、对裁判的态度、正面思考、成为被人支持的人、读书。
   <b style="color:var(--signal)">没有一条跟运气有关。八条全是在管理别人对你的直觉。</b></p></div>
  <div class="stage" data-s="2"><div class="mwrap">

      <p class="lede" style="margin-bottom:1rem">
      <b style="color:var(--signal)">中心那格</b>：写上刚才那道思考题的答案——未来一到三年，你最想做成的那件事。<br>
      <b style="color:var(--signal)">外圈八格</b>：为了做成它，你需要哪八样东西？<br>

      <ul class="points">
       <li>你的八格里，有几格其实是别人替你写的？</li>
       <li>如果只能留三格，你砍掉哪五个？砍的时候心里最疼的那个，可能才是真的</li>
       <li>「运气」那格，你能写出八条明天就能做的动作吗？大谷十七岁写出来了</li>
       <li>「人品」那格里，有没有一条是你这周真的没做到的？</li>
      </ul></div>
  </div></div>
 </div>`});

/* ── 交互 ── */
const deck=document.getElementById('deck'),ticks=document.getElementById('ticks'),
      pg=document.getElementById('pg'),hint=document.getElementById('hint');
let cur=0,stage=SLIDES.map(()=>0),showHint=false;
const LB={blind:['① 红队','② 蓝队','③ 对照','④ 揭晓'],open:['① 出题','② 收票','③ 揭晓']};
let lastAct=null;
SLIDES.forEach((s,i)=>{
 const el=document.createElement('section');
 el.className='slide';el.dataset.i=i;el.innerHTML=s.html;
 if(s.stages>1){
  const bar=document.createElement('div');bar.className='stagebar';
  (s.labs||LB[s.mode]||['① 概览','② 展开']).forEach((t,k)=>{
    const b=document.createElement('button');b.className='sbtn';b.textContent=t;
    b.onclick=()=>{stage[i]=k;paint();};bar.appendChild(b);});
  el.appendChild(bar);
 }
 deck.appendChild(el);
 const t=document.createElement('button');t.className='tick';
 const a=s.exp!=null?EXPS[s.exp].act:null;
 if(a!==lastAct)t.dataset.brk='1';
 lastAct=a;
 t.title=(s.exp!=null?EXPS[s.exp].no+' '+EXPS[s.exp].title:'第 '+(i+1)+' 页');
 t.onclick=()=>{cur=i;paint();};ticks.appendChild(t);
});
const size=i=>{const el=document.getElementById(i===0?'redN':'blueN');
  const v=el?parseInt(el.value,10):15;return v>0?v:15;};
function update(){
 EXPS.forEach((e,ei)=>{
   e.rows.forEach((r,i)=>{const s=document.getElementById('sz'+ei+i);if(s)s.textContent=size(i);});
   const vals=e.rows.map((r,i)=>{
     const g=k=>{const el=document.querySelector(`input[data-e="${ei}"][data-i="${i}"][data-k="${k}"]`);
                 return el&&el.value!==''?parseFloat(el.value):null;};
     if(e.slots){
       const cs=[...document.querySelectorAll(`input.cell[data-e="${ei}"][data-i="${i}"]`)]
         .map(x=>parseFloat(x.value)).filter(x=>!isNaN(x));
       const st=document.getElementById('st'+ei+i);
       if(!cs.length){if(st)st.innerHTML='已录入 <b>0</b> 人 · 平均 <b>—</b> · 中位 <b>—</b>';return null;}
       const avg=cs.reduce((a,b)=>a+b,0)/cs.length, s=[...cs].sort((a,b)=>a-b);
       const med=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;
       const rd=x=>Math.round(x*10)/10;
       if(st)st.innerHTML=`已录入 <b>${cs.length}</b> 人 · 平均 <b>${rd(avg)}</b> · 中位 <b>${rd(med)}</b>`;
       return {raw:avg,txt:rd(avg)+' '+e.unit};
     }
     if(e.type==='pct'){const n=g('n');
       return n===null?null:{p:Math.max(0,Math.min(100,n/size(i)*100)),txt:Math.round(n/size(i)*100)+'%'};}
     const v=g('v');return v===null?null:{raw:v,txt:v+' '+e.unit};});
   let max=1;
   if(e.type!=='pct')max=Math.max(1,...vals.filter(Boolean).map(v=>v.raw));
   const slideEl=[...deck.children].find(el=>SLIDES[+el.dataset.i].exp===ei);
   if(!slideEl)return;
   slideEl.querySelectorAll('.stage .bars').forEach(group=>{
     [...group.children].forEach((row,i)=>{
       if(row.classList.contains('ghost'))return;
       const f=row.querySelector('.barfill'),t=row.querySelector('.barval'),v=vals[i];
       if(!v){f.style.width='0%';t.textContent='—';return;}
       f.style.width=(e.type==='pct'?v.p:v.raw/max*100)+'%';t.textContent=v.txt;});
   });});
}
function paint(){
 [...deck.children].forEach((el,i)=>{
   el.classList.toggle('on',i===cur);
   el.querySelectorAll('.stage').forEach(s=>s.classList.toggle('on',+s.dataset.s===stage[i]));
   el.querySelectorAll('.sbtn').forEach((b,k)=>b.classList.toggle('on',k===stage[i]));});
 [...ticks.children].forEach((t,i)=>{
   t.className='tick'+(i===cur?' now':(i<cur?' done':''))+(t.dataset.brk?' brk':'');});
 pg.textContent=String(cur+1).padStart(2,'0')+' / '+String(SLIDES.length).padStart(2,'0');
 hint.querySelector('p').textContent=SLIDES[cur].host||'';
 hint.classList.toggle('on',showHint&&!!SLIDES[cur].host);
 update();
}
document.addEventListener('input',ev=>{if(ev.target.matches('input[type=number]'))update();});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Enter'&&ev.target.matches('input.cell')){
   ev.preventDefault();
   const all=[...deck.children[cur].querySelectorAll('input.cell')];
   const nx=all[all.indexOf(ev.target)+1]; if(nx){nx.focus();nx.select();}
 }},true);
function step(d){
 const s=SLIDES[cur];
 if(d>0){if(stage[cur]<s.stages-1)stage[cur]++;else if(cur<SLIDES.length-1)cur++;}
 else{if(stage[cur]>0)stage[cur]--;else if(cur>0){cur--;stage[cur]=SLIDES[cur].stages-1;}}
 paint();}
document.addEventListener('keydown',ev=>{
 if(ev.target.matches('input')&&['ArrowRight','ArrowLeft'].includes(ev.key))return;
 if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='PageDown'){ev.preventDefault();step(1);}
 if(ev.key==='ArrowLeft'||ev.key==='PageUp'){ev.preventDefault();step(-1);}
 if(ev.key==='t'||ev.key==='T'){showHint=!showHint;paint();}
 if(ev.key==='r'||ev.key==='R'){
   deck.children[cur].querySelectorAll('input[data-k="n"],input[data-k="v"],input.cell').forEach(i=>i.value='');
   update();}});
paint();
</script>
</body>
</html>
